<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Class Attendance Tracker</title>
    <!-- Preload critical background and lever assets for instant, lag-free loading -->
    <link rel="preload" as="image" href="jimmobilebg.jpg">
    <link rel="preload" as="image" href="skaterbg1.jpg">
    <link rel="preload" as="image" href="phbg.jpeg">
    <link rel="preload" as="image" href="bg.jpg">
    <link rel="preload" as="image" href="lever_base_rig.png">
    <link rel="preload" as="image" href="lever_arm_rig.png">
    <link rel="preload" as="image" href="upes.png">
    <!-- PWA & Mobile App Experience -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Attendance Tracker">
    <link rel="apple-touch-icon" href="micon.png">
    <link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            900: '#111827',
                            800: '#1f2937',
                            700: '#374151',
                        }
                    },
                    fontFamily: {
                        'drippy': ['Nosifer', 'cursive'],
                    }
                }
            }
        }
    </script>
    <style>
        @media (hover: hover) and (pointer: fine) {
            html, body, *, a, button, input, select, textarea, [role="button"], *::before, *::after {
                cursor: none !important;
            }
        }

        #custom-cursor {
            position: fixed;
            width: 16px;
            height: 16px;
            background-image: url('curser_med.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 10001;
            will-change: left, top;
        }

        @media (hover: none), (pointer: coarse) {
            #custom-cursor {
                display: none !important;
            }
        }

        .cursor-hover {
            transform: scale(1.3) !important;
        }

        /* Hide the default browser arrows on number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Prevent all unwanted mobile zooming gestures & overscroll */
        html, body {
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        input, button, select, textarea {
            touch-action: manipulation;
            font-size: 16px !important; /* Prevents iOS auto-zoom on input focus */
            -webkit-user-select: auto;
            user-select: auto;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s, transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
            overflow: hidden;
            touch-action: none;
        }

        #splash-screen::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            filter: contrast(1.1) brightness(0.9);
            transition: filter 1.2s ease, transform 1.2s ease, opacity 0.4s ease;
        }

        body {
            background-color: #111827;
        }

        /* Fixed background element to solve mobile stretching bugs */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0b0f19;
            background-image: url('skaterbg1.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Mobile specific background */
        @media (max-width: 768px) {
            body::before {
                background-image: url('phbg.jpeg');
            }
            #splash-screen::before {
                background-image: url('jimmobilebg.jpg');
            }
            .splash-text {
                position: absolute;
                top: 36vh; /* Position under neck cleanly */
                left: 50%;
                transform: translateX(-50%);
                width: 100%;
                margin-top: 0;
            }
            .subject-card {
                background-color: rgba(59, 130, 246, 0.08) !important;
                backdrop-filter: blur(6px) !important;
                -webkit-backdrop-filter: blur(6px) !important;
                border-color: rgba(255, 255, 255, 0.1) !important;
            }
        }

        /* OG Glass Green Glowing Start Button */
        .og-glass-green {
            background: rgba(16, 185, 129, 0.12) !important;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(52, 211, 153, 0.45) !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.3);
            animation: glass-green-pulse 2.2s infinite ease-in-out;
        }

        .og-glass-green:hover {
            transform: scale(1.05) translateY(-2px);
            background: rgba(16, 185, 129, 0.22) !important;
            border-color: rgba(52, 211, 153, 0.8) !important;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.6), 0 0 70px rgba(16, 185, 129, 0.25), inset 0 1px 3px rgba(255, 255, 255, 0.6);
        }

        @keyframes glass-green-pulse {
            0%, 100% {
                box-shadow: 0 0 18px rgba(16, 185, 129, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.3);
                border-color: rgba(52, 211, 153, 0.4);
            }
            50% {
                box-shadow: 0 0 32px rgba(16, 185, 129, 0.55), 0 0 50px rgba(16, 185, 129, 0.25), inset 0 1px 3px rgba(255, 255, 255, 0.55);
                border-color: rgba(52, 211, 153, 0.75);
            }
        }

        /* Noise effect overlay */
        .noise-overlay {
            position: absolute;
            top: -50%;
            left: -50%;
            right: -50%;
            bottom: -50%;
            width: 200%;
            height: 200%;
            background: transparent url('http://assets.iceable.com/img/noise-transparent.png') repeat 0 0;
            background: transparent url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAAD9tt+XAAAABlBMVEUAAAAAAAClZ7nPAAAAAnRSTlMAGovxNEIAAAAnSURBVDjXY2BIAIIDAgYIDAgYIDAgYIDAgYIDAgYIDAgYIDAgYEBgAD4FAv6yV1MNAAAAAElFTkSuQmCC') repeat 0 0;
            opacity: .18;
            pointer-events: none;
            z-index: 1;
            animation: noise-anim .2s infinite;
        }

        @keyframes noise-anim {
            0% { transform: translate(0,0) }
            10% { transform: translate(-1%,-1%) }
            20% { transform: translate(-2%,1%) }
            30% { transform: translate(1%,-2%) }
            40% { transform: translate(-1%,3%) }
            50% { transform: translate(-2%,1%) }
            60% { transform: translate(3%,0) }
            70% { transform: translate(0,2%) }
            80% { transform: translate(-3%,1%) }
            90% { transform: translate(1%,3%) }
            100% { transform: translate(1%,1%) }
        }

        .splash-content {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
        }

        .hidden-splash .splash-content {
            transform: scale(1.15) translateY(-20px);
            opacity: 0;
        }

        .splash-text {
            color: #ff1493;
            font-family: 'Nosifer', cursive;
            font-size: clamp(1.2rem, 5vw, 3.5rem);
            text-align: center;
            pointer-events: auto;
            user-select: none;
            white-space: normal;
            letter-spacing: 0.1em;
            display: flex;
            flex-direction: column; /* Stack the lines */
            align-items: center;
            justify-content: center;
            gap: 1em; /* Space between lines */
            max-width: 95%;
            z-index: 10;
        }

        .text-line {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 0.2em;
        }

        .splash-text span {
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 
                3px 3px 0px #000,
                -1px -1px 0px #000,  
                1px -1px 0px #000,
                -1px 1px 0px #000,
                1px 1px 0px #000;
        }


        .splash-text span:hover {
            transform: scale(1.4) translateY(-10px);
            color: #ff6ec7;
            filter: drop-shadow(0 0 20px #ff1493);
            z-index: 20;
        }

        @keyframes drip-pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 20, 147, 0.5)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.8)); }
        }



        .music-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            background: rgba(31, 41, 55, 0.5);
            backdrop-filter: blur(8px);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            overflow: hidden;
            padding: 0;
        }

        .music-toggle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .music-toggle:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: #3b82f6;
        }

        .music-toggle.playing {
            animation: pulse 2s infinite;
            border-color: #3b82f6;
        }

        .music-toggle.playing img {
            animation: rotate 3s linear infinite;
        }

        /* CD hole effect */
        .music-toggle::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: #111827;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 5px #000;
        }


        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .hidden-splash {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.05);
            filter: blur(8px);
        }

        .hidden-splash::before {
            filter: contrast(1.1) brightness(0) blur(10px) !important;
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 font-sans">
    <!-- Splash Screen -->
    <div id="splash-screen" class="cursor-default">
        <div class="noise-overlay"></div>
        <div class="splash-content flex flex-col items-center justify-center h-full w-full">
            <div class="splash-text" id="drippyText">
                <!-- Spans will be injected here by JS -->
            </div>
            <!-- Desktop: OG Glass Green Glowing Button (centered below pink text) -->
            <div id="desktop-entry" onclick="triggerEnter()" class="mt-8 z-30 og-glass-green px-7 py-3 rounded-full cursor-pointer select-none transition-all duration-300 hidden md:flex items-center gap-3 group">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
                </span>
                <span class="text-emerald-300 text-xs tracking-[0.25em] uppercase font-mono font-bold drop-shadow-[0_0_10px_rgba(52,211,153,0.7)] group-hover:text-white transition-colors">
                    Click anywhere to start
                </span>
                <svg class="w-3.5 h-3.5 text-emerald-400 group-hover:translate-x-1 transition-transform drop-shadow-[0_0_8px_rgba(52,211,153,0.6)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                </svg>
            </div>

            <!-- Mobile: Interactive Lever with Cartoon Guy Physically Pulling/Pushing -->
            <div id="mobile-lever-container" class="md:hidden absolute left-0 w-full flex flex-col items-center justify-end z-20 pointer-events-auto select-none" style="bottom: max(env(safe-area-inset-bottom, 24px), 24px); touch-action: none;">
                <div id="lever-hint-pill" class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-black/60 border border-white/20 backdrop-blur-md mb-2 transition-all duration-300 pointer-events-none">
                    <span id="lever-hint-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_#ef4444]"></span>
                    <span id="lever-hint-text" class="text-white/90 text-xs tracking-widest font-mono uppercase font-bold">Drag finger to pull lever</span>
                </div>
                
                <div id="custom-lever-track" class="relative flex items-center justify-center overflow-visible" style="width: 280px; height: 210px; touch-action: none;">
                    <!-- Floor shadow -->
                    <div class="absolute bottom-2 left-6 right-6 h-4 bg-black/50 rounded-full blur-md pointer-events-none"></div>

                    <!-- Fixed Lever Base (anchored firmly to floor) -->
                    <img id="lever-base-img" src="lever_base_rig.png" alt="Base" class="absolute pointer-events-none select-none" style="width: 240px; height: 240px; bottom: 0; right: 20px; object-fit: contain; z-index: 10;" />

                    <!-- Cartoon Character + Lever Arm Rig (Pivots from the base center) -->
                    <div id="lever-arm-wrapper" class="absolute cursor-grab select-none" style="width: 240px; height: 240px; bottom: 0; right: 20px; touch-action: none; transform-origin: 75.3% 82.4%; will-change: transform; z-index: 15;">
                        <img id="lever-arm-img" src="lever_arm_rig.png" alt="Character Pulling Lever" class="w-full h-full object-contain pointer-events-none select-none" />
                        
                        <!-- Red/Green Power Sphere positioned over the red knob at 38% X, 7% Y -->
                        <div id="sphere-glow-overlay" class="absolute pointer-events-none rounded-full" style="
                            width: 32px; 
                            height: 32px; 
                            top: 7%; 
                            left: 38%; 
                            transform: translate(-50%, -50%);
                            background: radial-gradient(circle, rgba(239, 68, 68, 0.9) 20%, rgba(239, 68, 68, 0) 70%);
                            box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
                            transition: background 0.15s ease, box-shadow 0.15s ease;
                            z-index: 20;
                        "></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Music Control -->
    <button id="musicToggle" class="music-toggle" onclick="toggleMusic()" title="Toggle Music">
        <img src="micon.png" alt="Music Icon">
    </button>
    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="custom-cursor"></div>

    <div class="max-w-4xl mx-auto px-6 mb-8 pt-6 flex justify-center">
        <img src="upes.png" alt="UPES Logo" class="w-2/3 sm:w-1/2 md:w-1/3 h-auto rounded-2xl shadow-2xl transition-all duration-500 hover:drop-shadow-[0_0_35px_rgba(255,255,255,0.8)] hover:scale-[1.01] object-contain max-h-[120px] md:max-h-[200px] bg-white/5 p-2">
    </div>

    <div class="max-w-4xl mx-auto px-6">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8 bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700">
            <h1 class="text-2xl font-bold tracking-tight text-center sm:text-left">Semester Attendance Tracker</h1>
            <div class="flex items-center justify-center gap-3 bg-gray-900 p-2 rounded-lg border border-gray-700 w-full sm:w-auto">
                <label for="target" class="text-sm text-gray-400 font-medium ml-2 whitespace-nowrap">Target Goal:</label>
                <div class="flex items-center">
                    <input type="number" id="target" value="75" min="1" max="100" class="w-16 bg-gray-800 text-white px-2 py-1.5 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-center font-bold text-lg transition-all">
                    <span class="text-gray-400 ml-1 mr-2">%</span>
                </div>
            </div>
        </div>

        <div class="mb-8 flex flex-col sm:flex-row gap-3">
            <input type="text" id="newSubject" placeholder="Enter Additional Subject Name..." class="flex-1 w-full bg-gray-800 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500">
            <button onclick="addSubject()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-semibold transition-colors duration-200 shadow-lg w-full sm:w-auto">Add Subject</button>
            <button onclick="resetToDefaults()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-4 py-3 rounded-xl font-medium transition-colors duration-200 border border-gray-600 w-full sm:w-auto text-sm" title="Reset to default subjects">Reset Subjects</button>
        </div>

        <div id="subjectsContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        </div>
    </div>

    <script>
        // Shared template with updated totals matching latest academic calendar (ss_new.jpg)
        const defaultSubjects = [
            { id: 1, name: 'Databases', totalSemester: 61, held: 0, attended: 0 },
            { id: 2, name: 'Python Programming', totalSemester: 60, held: 0, attended: 0 },
            { id: 3, name: 'Design & Analysis of Algorithms', totalSemester: 44, held: 0, attended: 0 },
            { id: 4, name: 'Discrete Mathematics', totalSemester: 43, held: 0, attended: 0 },
            { id: 5, name: 'Elements of AIML', totalSemester: 47, held: 0, attended: 0 },
            { id: 6, name: 'Remote Sensing', totalSemester: 38, held: 0, attended: 0 },
            { id: 7, name: 'Material Technology I', totalSemester: 33, held: 0, attended: 0 }
        ];

        // Fresh memory key (v5) so PC and Mobile automatically get the new counts
        const STORAGE_KEY = 'attendanceData_v5';
        const TARGET_KEY = 'attendanceTarget_v5';

        let subjects = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!subjects || subjects.length === 0) {
            // Carry over user progress if they had previously tracked attended/held in v4
            const prevData = JSON.parse(localStorage.getItem('attendanceData_v4')) || JSON.parse(localStorage.getItem('attendanceData'));
            if (prevData && Array.isArray(prevData) && prevData.length > 0) {
                subjects = defaultSubjects.map(def => {
                    const match = prevData.find(p => p.id === def.id || (p.name && p.name.toLowerCase() === def.name.toLowerCase()));
                    return {
                        id: def.id,
                        name: def.name,
                        totalSemester: def.totalSemester,
                        held: match ? match.held : 0,
                        attended: match ? match.attended : 0
                    };
                });
            } else {
                subjects = JSON.parse(JSON.stringify(defaultSubjects));
            }
            saveData();
        }

        const targetInput = document.getElementById('target');
        
        const savedTarget = localStorage.getItem(TARGET_KEY) || localStorage.getItem('attendanceTarget_v4');
        if(savedTarget) targetInput.value = savedTarget;

        targetInput.addEventListener('input', () => {
            let val = parseInt(targetInput.value);
            if (val > 100) targetInput.value = 100;
            if (val < 1) targetInput.value = 1;
            localStorage.setItem(TARGET_KEY, targetInput.value);
            renderCards();
        });

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(subjects));
        }

        function resetToDefaults() {
            if (confirm("Reset subjects to new semester defaults?")) {
                subjects = JSON.parse(JSON.stringify(defaultSubjects));
                saveData();
                renderCards();
            }
        }

        function addSubject() {
            const input = document.getElementById('newSubject');
            const name = input.value.trim();
            if (name) {
                // Allow them to set a custom total if they add a totally new subject
                let customTotal = prompt("Enter total semester classes for this subject:", "50");
                let totalNum = parseInt(customTotal) || 0;
                subjects.push({ id: Date.now(), name: name, totalSemester: totalNum, held: 0, attended: 0 });
                input.value = '';
                saveData();
                renderCards();
            }
        }

        function deleteSubject(id) {
            subjects = subjects.filter(sub => sub.id !== id);
            saveData();
            renderCards();
        }

        function updateCount(id, field, delta) {
            const subject = subjects.find(sub => sub.id === id);
            if (subject) {
                subject[field] = Math.max(0, subject[field] + delta);
                validateAndSave(subject, field);
            }
        }

        function setCount(id, field, value) {
            const subject = subjects.find(sub => sub.id === id);
            if (subject) {
                let val = parseInt(value) || 0;
                subject[field] = Math.max(0, val);
                validateAndSave(subject, field);
            }
        }

        function validateAndSave(subject, field) {
            if (field === 'attended' && subject.attended > subject.held) {
                subject.held = subject.attended;
            }
            if (field === 'held' && subject.held < subject.attended) {
                subject.attended = subject.held;
            }
            if (subject.held > subject.totalSemester) {
                subject.totalSemester = subject.held;
            }
            saveData();
            renderCards();
        }

        function calculateStats(attended, held, totalSemester, target) {
            const currentPercent = held === 0 ? 0 : (attended / held) * 100;
            const remainingClasses = Math.max(0, totalSemester - held);
            
            // Strict > target% rule as per university guidelines and ss_new.jpg
            const exactRequired = (target / 100) * totalSemester;
            let totalRequiredToPass;
            if (Number.isInteger(exactRequired)) {
                totalRequiredToPass = exactRequired + 1; // Strict > 75%
            } else {
                totalRequiredToPass = Math.ceil(exactRequired);
            }
            
            let moreNeeded = totalRequiredToPass - attended;
            if (moreNeeded < 0) moreNeeded = 0;

            const skippable = remainingClasses - moreNeeded;

            return { 
                currentPercent: currentPercent.toFixed(2), 
                remainingClasses,
                moreNeeded, 
                skippable 
            };
        }

        function renderCards() {
            const container = document.getElementById('subjectsContainer');
            const target = parseFloat(targetInput.value) || 75;
            container.innerHTML = '';

            subjects.forEach(sub => {
                const stats = calculateStats(sub.attended, sub.held, sub.totalSemester, target);
                
                let statusColor = stats.currentPercent >= target ? 'text-blue-400' : 'text-orange-400';
                if(stats.currentPercent < (target - 10)) statusColor = 'text-red-500';
                if(sub.held === 0) statusColor = 'text-gray-400';

                let predictionHTML = '';
                if (sub.totalSemester === 0 || sub.totalSemester <= sub.held) {
                    predictionHTML = `<span class="text-gray-400 font-medium">Semester finished or set Total Classes.</span>`;
                } else if (stats.skippable < 0) {
                    predictionHTML = `<span class="text-red-500 font-bold bg-red-500/10 px-3 py-1 rounded-md">Impossible to reach ${target}%. Short by ${Math.abs(stats.skippable)}.</span>`;
                } else {
                    predictionHTML = `
                        <div class="flex flex-col gap-1">
                            <span class="text-blue-400 font-medium">Must attend: <span class="font-bold text-white">${stats.moreNeeded}</span> out of remaining ${stats.remainingClasses}</span>
                            <span class="text-green-400 font-medium">Safe to skip: <span class="font-bold text-white">${stats.skippable}</span> classes</span>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'subject-card bg-gray-800 p-5 rounded-2xl shadow-md border border-gray-700 relative hover:border-gray-600 transition-colors';
                
                card.innerHTML = `
                    <button onclick="deleteSubject(${sub.id})" class="absolute top-4 right-4 text-gray-600 hover:text-red-400 transition-colors" title="Delete Subject">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                    
                    <h2 class="text-xl font-bold mb-5 pr-8 text-blue-300 md:text-gray-100">${sub.name}</h2>
                    
                    <div class="mb-5 bg-gray-900/50 p-3 rounded-lg border border-gray-700/50 flex justify-between items-center">
                        <span class="text-sm text-gray-400 font-medium">Final Total Classes for Semester:</span>
                        <div class="flex items-center gap-2 bg-gray-800 px-2 py-1 rounded-lg border border-gray-700">
                            <button onclick="updateCount(${sub.id}, 'totalSemester', -1)" class="w-6 h-6 flex items-center justify-center rounded bg-gray-700 hover:bg-gray-600 text-sm font-bold transition-colors">-</button>
                            <input type="number" value="${sub.totalSemester}" onchange="setCount(${sub.id}, 'totalSemester', this.value)" class="w-12 bg-transparent text-center font-mono text-lg font-bold focus:outline-none focus:bg-gray-600 rounded text-white">
                            <button onclick="updateCount(${sub.id}, 'totalSemester', 1)" class="w-6 h-6 flex items-center justify-center rounded bg-gray-700 hover:bg-gray-600 text-sm font-bold transition-colors">+</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-gray-900 p-3 rounded-xl border border-gray-700">
                            <p class="text-xs text-gray-400 mb-2 uppercase tracking-wider font-semibold text-center">Attended</p>
                            <div class="flex items-center justify-between">
                                <button onclick="updateCount(${sub.id}, 'attended', -1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-800 hover:bg-gray-600 text-xl font-bold transition-colors">-</button>
                                <input type="number" value="${sub.attended}" onchange="setCount(${sub.id}, 'attended', this.value)" class="w-12 bg-transparent text-center font-mono text-xl font-bold focus:outline-none focus:bg-gray-700 rounded text-white">
                                <button onclick="updateCount(${sub.id}, 'attended', 1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-800 hover:bg-gray-600 text-xl font-bold transition-colors">+</button>
                            </div>
                        </div>
                        
                        <div class="bg-gray-900 p-3 rounded-xl border border-gray-700">
                            <p class="text-xs text-gray-400 mb-2 uppercase tracking-wider font-semibold text-center">Held So Far</p>
                            <div class="flex items-center justify-between">
                                <button onclick="updateCount(${sub.id}, 'held', -1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-800 hover:bg-gray-600 text-xl font-bold transition-colors">-</button>
                                <input type="number" value="${sub.held}" onchange="setCount(${sub.id}, 'held', this.value)" class="w-12 bg-transparent text-center font-mono text-xl font-bold focus:outline-none focus:bg-gray-700 rounded text-white">
                                <button onclick="updateCount(${sub.id}, 'held', 1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-800 hover:bg-gray-600 text-xl font-bold transition-colors">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-gray-900 rounded-xl p-4 border border-gray-700 shadow-inner">
                        <div class="flex justify-between items-end mb-3 pb-3 border-b border-gray-800">
                            <span class="text-sm text-gray-400 font-medium">Current LMS %</span>
                            <span class="text-3xl font-bold tracking-tight ${statusColor}">${stats.currentPercent}%</span>
                        </div>
                        
                        <div class="text-sm mt-2">
                            ${predictionHTML}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Initial render
        renderCards();

        // Inject drippy text spans
        const textContainer = document.getElementById('drippyText');
        const lines = ["ARE YOU READY TO", "BE", "DEBARRED"];
        
        lines.forEach(lineText => {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'text-line';
            lineText.split("").forEach(char => {
                const span = document.createElement('span');
                span.textContent = char === " " ? "\u00A0" : char;
                lineDiv.appendChild(span);
            });
            textContainer.appendChild(lineDiv);
        });

        // Music and Splash Logic
        const splash = document.getElementById('splash-screen');
        const music = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        const musicIcon = document.getElementById('musicIcon');

        function triggerEnter() {
            splash.classList.add('hidden-splash');
            if (!isPlaying) {
                toggleMusic(); // Cinematic entry with music
            }
        }

        splash.addEventListener('click', (e) => {
            // Only allow click-to-enter on desktop
            if (window.innerWidth >= 768) {
                triggerEnter();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (window.innerWidth >= 768 || e.key === 'Enter') {
                triggerEnter();
            }
        });

        // --- Physical Lever Interaction for Mobile ---
        const armWrapper = document.getElementById('lever-arm-wrapper');
        const sphereGlow = document.getElementById('sphere-glow-overlay');
        const leverHintText = document.getElementById('lever-hint-text');
        const leverHintDot = document.getElementById('lever-hint-dot');

        let isDraggingLever = false;
        let startTouchX = 0;
        let leverEngaged = false;
        const MAX_TRAVEL = 90; // Drag travel in pixels

        // Synthesized mechanical gear latch sound via Web Audio API
        function playLeverClack() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const t = ctx.currentTime;
                
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();

                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(160, t);
                osc1.frequency.exponentialRampToValueAtTime(30, t + 0.08);

                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(320, t);
                osc2.frequency.exponentialRampToValueAtTime(40, t + 0.06);

                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);

                osc1.start(t);
                osc2.start(t);
                osc1.stop(t + 0.1);
                osc2.stop(t + 0.1);
            } catch(e) {}
        }

        function handleDragStart(clientX) {
            if (leverEngaged || window.innerWidth >= 768) return;
            isDraggingLever = true;
            startTouchX = clientX;
            if (armWrapper) {
                armWrapper.style.transition = 'none';
                armWrapper.style.cursor = 'grabbing';
            }
        }

        function handleDragMove(clientX) {
            if (!isDraggingLever || leverEngaged || !armWrapper) return;
            const deltaX = clientX - startTouchX;
            let progress = Math.min(1, Math.abs(deltaX) / MAX_TRAVEL);
            let angle, skew;
            
            if (deltaX >= 0) {
                // Pushing lever forward (clockwise rotation + character leaning forward)
                angle = progress * 32;
                skew = -progress * 12;
            } else {
                // Pulling lever backward (counter-clockwise rotation + character pulling back)
                angle = -progress * 26;
                skew = progress * 14;
            }
            
            armWrapper.style.transform = `rotate(${angle}deg) skewX(${skew}deg)`;
            
            // Shift glow color from crimson red to intense neon green
            const r = Math.round(239 * (1 - progress) + 34 * progress);
            const g = Math.round(68 * (1 - progress) + 197 * progress);
            const b = Math.round(68 * (1 - progress) + 94 * progress);
            
            if (sphereGlow) {
                sphereGlow.style.background = `radial-gradient(circle, rgba(${r},${g},${b},0.95) 20%, rgba(${r},${g},${b},0) 70%)`;
                sphereGlow.style.boxShadow = `0 0 ${20 + progress * 30}px rgba(${r}, ${g}, ${b}, ${0.7 + progress * 0.3})`;
            }
            
            if (progress >= 0.75) {
                if (leverHintText) leverHintText.textContent = "RELEASE TO ENGAGE";
                if (leverHintDot) leverHintDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-ping shadow-[0_0_8px_#34d399]";
            } else {
                if (leverHintText) leverHintText.textContent = deltaX >= 0 ? "Pushing Lever..." : "Pulling Lever...";
                if (leverHintDot) leverHintDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse shadow-[0_0_8px_#f59e0b]";
            }
        }

        function handleDragEnd(clientX) {
            if (!isDraggingLever || leverEngaged || !armWrapper) return;
            isDraggingLever = false;
            armWrapper.style.cursor = 'grab';
            
            const deltaX = clientX - startTouchX;
            const progress = Math.min(1, Math.abs(deltaX) / MAX_TRAVEL);
            
            if (progress >= 0.75) {
                leverEngaged = true;
                playLeverClack();
                if (navigator.vibrate) navigator.vibrate([35, 50, 45]);
                
                // Snap to locked engaged posture
                armWrapper.style.transition = 'transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                const finalAngle = deltaX >= 0 ? 36 : -30;
                const finalSkew = deltaX >= 0 ? -14 : 16;
                armWrapper.style.transform = `rotate(${finalAngle}deg) skewX(${finalSkew}deg)`;
                
                if (sphereGlow) {
                    sphereGlow.style.background = `radial-gradient(circle, rgba(34,197,94,1) 25%, rgba(34,197,94,0) 70%)`;
                    sphereGlow.style.boxShadow = `0 0 50px rgba(34, 197, 94, 1), 0 0 100px rgba(34, 197, 94, 0.6)`;
                }
                
                if (leverHintText) leverHintText.textContent = "ENGAGED!";
                if (leverHintDot) leverHintDot.className = "w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_12px_#34d399]";
                
                setTimeout(() => {
                    triggerEnter();
                }, 350);
            } else {
                // Snap back to resting state
                armWrapper.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                armWrapper.style.transform = 'rotate(0deg) skewX(0deg)';
                
                if (sphereGlow) {
                    sphereGlow.style.background = `radial-gradient(circle, rgba(239,68,68,0.9) 20%, rgba(239,68,68,0) 70%)`;
                    sphereGlow.style.boxShadow = `0 0 20px rgba(239, 68, 68, 0.7)`;
                }
                
                if (leverHintText) leverHintText.textContent = "Drag finger to pull lever";
                if (leverHintDot) leverHintDot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_#ef4444]";
            }
        }

        // Enable touch dragging across the mobile splash screen or directly on lever
        const splashScreenEl = document.getElementById('splash-screen');
        if (splashScreenEl) {
            splashScreenEl.addEventListener('touchstart', (e) => {
                if (window.innerWidth < 768 && e.touches.length === 1) {
                    handleDragStart(e.touches[0].clientX);
                }
            }, { passive: true });

            splashScreenEl.addEventListener('touchmove', (e) => {
                if (isDraggingLever && e.touches.length === 1) {
                    handleDragMove(e.touches[0].clientX);
                }
            }, { passive: true });

            splashScreenEl.addEventListener('touchend', (e) => {
                if (isDraggingLever) {
                    const clientX = e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : startTouchX;
                    handleDragEnd(clientX);
                }
            }, { passive: true });

            splashScreenEl.addEventListener('touchcancel', () => {
                if (isDraggingLever) {
                    handleDragEnd(startTouchX);
                }
            }, { passive: true });

            // Pointer events for desktop testing or mouse drag
            if (armWrapper) {
                armWrapper.addEventListener('pointerdown', (e) => {
                    if (e.button === 0) {
                        handleDragStart(e.clientX);
                        armWrapper.setPointerCapture(e.pointerId);
                    }
                });
                armWrapper.addEventListener('pointermove', (e) => {
                    if (isDraggingLever) handleDragMove(e.clientX);
                });
                armWrapper.addEventListener('pointerup', (e) => {
                    if (isDraggingLever) {
                        armWrapper.releasePointerCapture(e.pointerId);
                        handleDragEnd(e.clientX);
                    }
                });
            }
        }

        // Strict prevention of mobile zooming & accidental double taps
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });

        let lastTouchEndGlobal = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEndGlobal <= 300) {
                e.preventDefault();
            }
            lastTouchEndGlobal = now;
        }, { passive: false });

        let isPlaying = false;
        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicToggle.classList.remove('playing');
            } else {
                music.play().catch(err => console.log("Audio play failed:", err));
                musicToggle.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }
        // Custom Cursor Logic
        const cursor = document.getElementById('custom-cursor');
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Use requestAnimationFrame for the smoothest possible movement
        function updateCursor() {
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
            requestAnimationFrame(updateCursor);
        }
        updateCursor();

        document.addEventListener('mousedown', () => {
            cursor.style.transform = 'scale(0.8)';
        });

        document.addEventListener('mouseup', () => {
            cursor.style.transform = 'scale(1)';
        });

        // Add hover effect for interactive elements
        const interactives = 'button, input, a, [onclick], .splash-content, .splash-text span, img';
        document.addEventListener('mouseover', (e) => {
            if (e.target.closest(interactives)) {
                cursor.style.transform = 'scale(1.3)';
            }
        });

        document.addEventListener('mouseout', (e) => {
            if (e.target.closest(interactives)) {
                cursor.style.transform = 'scale(1)';
            }
        });
    </script>
</body>
</html>
